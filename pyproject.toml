[project]
name = "pediatric-gastro-ai-assistant"
version = "0.1.0"
description = "BITSS - backend va chatbot tro ly tieu hoa nhi khoa: API FastAPI, ho so benh an phan, tro ly Gemini co rang buoc an toan."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "pyjwt>=2.15.0",
    "bcrypt>=5.0.0",
    # Khai bao truc tiep vi agent_service.py bat httpx.TransportError de biet luc nao
    # dang dut mang ma thu lai. Truoc day httpx chi di theo google-genai va starlette
    # TestClient; dua vao phu thuoc bac cau la dat cuoc rang hai thu do khong bao gio
    # doi tang van chuyen.
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Tap luat nen kinh dien cua ruff: pyflakes (F: import thua, ten chua dinh nghia, bien khong
# dung) va loi co ban cua pycodestyle (E4, E7, E9). Chay: uvx ruff check
# S: luat bao mat (chuyen tu bandit): bi mat go cung, SQL ghep chuoi, subprocess, pickle,
# random cho mat ma... Diem nao chap nhan duoc thi danh "# noqa: Sxxx - <ly do>" ngay tai dong.
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# Kiem thu va danh gia CO Y dung khoa gia, assert, subprocess va random co hat giong: luat S o
# day chi bao nham. Ma chay tren may chu (app/, scripts/, main.py, setup_database.py) van bi kiem.
"tests/**" = ["S"]
"danh_gia/**" = ["S"]
